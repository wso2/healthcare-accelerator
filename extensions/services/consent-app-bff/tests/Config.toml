hostname = "localhost"
port = 9092
corsAllowedOrigin = "http://localhost:3000"

# callIdp / getScimUser / getScimPatients are mocked at function level. The in-process mock IS
# listener on port 9196 serves the token endpoint and the consent management API.
idpBaseUrl = "http://localhost:9196"
idpTokenEndpoint = "http://localhost:9196/oauth2/token"
clientId = "test-client-id"

# Must be >= 32 characters for HS256
clientSecret = "test-secret-key-must-be-at-least-32-chars"

consentFlow = "scope"

# Mock IS only starts after module init, so load purposes lazily
fetchPurposesOnStartup = false
# singleConsentPerUser = true exercises the existing-consent lookup and revoke-after-create paths
singleConsentPerUser = true
showConsentElements = true
serviceId = "test-service"
alwaysAllowedScopes = ["openid"]

[scopeConsent]
purposeName = "SMART Scope Authorization"

[[purposeConsent]]
purposeName = "All Health Data Access"
